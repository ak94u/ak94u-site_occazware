{% extends "base.html" %}

{% block title %}Nouveau Mot de passe - Occaz' Gaming{% endblock %}

{% block content %}

<div class="max-w-md mx-auto px-6 py-12 text-zinc-900 dark:text-white">
    <div class="bg-white dark:bg-zinc-900 border border-gray-200 dark:border-gray-800 rounded-xl p-8 shadow-lg">
        
        <h1 class="text-2xl font-black mb-2">Choisir un nouveau mot de passe</h1>
        <p class="text-xs text-gray-500 dark:text-gray-400 mb-6">Modification du compte lié à : <span class="text-blue-500 font-semibold">{{ email }}</span></p>

        <form action="{{ url_for('auth_mot_de_passe.reinitialiser_page', email_user=email) }}" method="POST" class="space-y-4">
            <div>
                    <label for="login-password" class="block text-sm font-medium text-gray-300">
                        Nouveau mot de passe
                    </label>

                    <!-- WRAPPER AJOUTÉ (ne modifie rien, juste entoure) -->
                    <div class="relative">
                        <input id="new-password" name="password" type="password" required
                            autocomplete="current-password" placeholder="••••••••"
                            class="w-full text-sm bg-gray-50 dark:bg-zinc-950 border border-gray-300 dark:border-gray-700 rounded-lg px-3 py-2.5 focus:outline-none focus:border-blue-500">

                        <!-- Bouton visibilité -->
                        <button type="button" id="toggle-password" onclick="togglePassword('new-password', 'new-icon-eye', 'new-icon-eye-off')"
                                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white transition">

                            <!-- Icône œil -->
                            <svg id="new-icon-eye" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5"
                                fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7
                                        -1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>

                            <!-- Icône œil barré -->
                            <svg id="new-icon-eye-off" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden"
                                fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M13.875 18.825A10.05 10.05 0 0112 19c-4.477 0-8.268-2.943-9.542-7
                                        a9.97 9.97 0 012.223-3.592M9.88 9.88a3 3 0 104.24 4.24" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M3 3l18 18" />
                            </svg>
                        </button>
                    </div>
                </div>
                <label class="block text-sm font-medium mb-2">Confirmer le mot de passe</label>
                <input type="password" name="password_confirm" required placeholder="••••••••" 
                       class="w-full text-sm bg-gray-50 dark:bg-zinc-950 border border-gray-300 dark:border-gray-700 rounded-lg px-3 py-2.5 focus:outline-none focus:border-blue-500">
            </div>

            <button type="submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm rounded-lg shadow-md transition">
                💾 Sauvegarder le mot de passe
            </button>
        </form>

    </div>
</div>
{% endblock %}
